model_list:
  - model_name: gpt-5.3-codex
    litellm_params:
      model: azure/gpt-5.3-codex
      api_base: https://your-resource.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-03-01-preview"
    model_info:
      base_model: azure/gpt-4o
      description: "Azure OpenAI GPT-5.3-codex"
      supports_function_calling: true

  - model_name: gpt-5.4-mini
    litellm_params:
      model: azure/gpt-5.4-mini
      api_base: https://your-resource.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-03-01-preview"
    model_info:
      base_model: azure/gpt-4o-mini
      description: "Azure OpenAI GPT-5.4-mini"
      supports_function_calling: true

  - model_name: gpt-5.4-pro
    litellm_params:
      model: azure/gpt-5.4-pro
      api_base: https://your-resource.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-03-01-preview"
    model_info:
      base_model: azure/gpt-4o
      description: "Azure OpenAI GPT-5.4-pro"
      supports_function_calling: true

  - model_name: o3
    litellm_params:
      model: azure/o3
      api_base: https://your-resource.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-03-01-preview"
    model_info:
      base_model: azure/o3
      description: "Azure OpenAI o3"
      supports_function_calling: true

  - model_name: gpt-image-1
    litellm_params:
      model: azure/gpt-image-1
      api_base: https://renci-nrig.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-04-01-preview"
    model_info:
      base_model: azure/gpt-image-1
      description: "Azure OpenAI GPT-Image-1 (Image Generation)"
      supports_function_calling: false
      supports_vision: false
      mode: image_generation

  - model_name: Kimi-K2.6
    litellm_params:
      model: azure/Kimi-K2.6
      api_base: https://your-resource.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_API_KEY
      api_version: "2025-03-01-preview"
    model_info:
      description: "Azure OpenAI Kimi-K2.6"
      supports_function_calling: true

router_settings:
  routing_strategy: simple-shuffle
  redis_host: redis
  redis_port: 6379
  num_retries: 2
  timeout: 600

litellm_settings:
  cache: true
  cache_type: redis
  drop_params: true
  track_cost_per_model: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  allow_cors: true
