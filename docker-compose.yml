services:
  # ---- Reverse Proxy ----
  nginx:
    image: docker.io/library/nginx:1-alpine
    container_name: llm-gw-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/fullchain.pem:/etc/ssl/public.pem:ro
      - ./ssl/privkey.pem:/etc/ssl/private.pem:ro
      - ./certbot-webroot:/var/www/certbot:ro
    networks:
      - frontend
    depends_on:
      gateway-app:
        condition: service_started
      gateway-api:
        condition: service_healthy
      vouch-proxy:
        condition: service_started
      litellm:
        condition: service_healthy
    restart: unless-stopped

  # ---- Auth Proxy (CILogon OIDC or GitHub OAuth) ----
  # Run ./vouch/generate-config.sh before 'docker compose up' to create vouch/config.yaml
  vouch-proxy:
    image: quay.io/vouch/vouch-proxy
    container_name: llm-gw-vouch
    # Run as container-root so it can read the bind-mounted /config regardless of
    # the host umask. The upstream image runs as uid 999, which cannot traverse a
    # config dir created under a restrictive umask (e.g. 027 -> 0750); under
    # rootless Podman "root" maps to the unprivileged runtime user, so this is safe
    # and keeps the config non-world-readable.
    user: "0:0"
    volumes:
      - ./vouch:/config:ro
    networks:
      - frontend
    restart: unless-stopped

  # ---- Gateway API (FastAPI) ----
  gateway-api:
    build:
      context: ./gateway-api
      dockerfile: Dockerfile
    container_name: llm-gw-api
    environment:
      - GATEWAY_CONFIG_PATH=/app/config/gateway.yaml
      - LITELLM_API_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - GATEWAY_FQDN=${GATEWAY_FQDN}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-github}
      - DATABASE_URL=postgresql+asyncpg://gateway:${GATEWAY_DB_PASSWORD}@gateway-db:5432/gateway
    volumes:
      - ./config:/app/config:ro
    networks:
      - frontend
      - backend
    depends_on:
      gateway-db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---- Gateway Frontend (Next.js) ----
  gateway-app:
    build:
      context: ./gateway-app
      dockerfile: Dockerfile
    container_name: llm-gw-app
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
    networks:
      - frontend
    restart: unless-stopped

  # ---- LiteLLM Proxy ----
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: llm-gw-litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_POSTGRES_PASSWORD}@litellm-db:5432/litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LITELLM_LOG=INFO
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # LiteLLM reads UI_USERNAME / UI_PASSWORD (see litellm/proxy/auth/login_utils.py).
      # The LITELLM_-prefixed names are kept on the .env side for backwards compatibility.
      - UI_USERNAME=${LITELLM_UI_USERNAME:-admin}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:-}
    command: >
      --config /app/config.yaml
      --port 4000
      --num_workers 4
    networks:
      - frontend
      - backend
      - llm_backends
    depends_on:
      litellm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:4000/health/liveliness'))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ---- LiteLLM Database ----
  litellm-db:
    image: docker.io/library/postgres:15-alpine
    container_name: llm-gw-litellm-db
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Gateway Database ----
  gateway-db:
    image: docker.io/library/postgres:15-alpine
    container_name: llm-gw-gateway-db
    environment:
      - POSTGRES_DB=gateway
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=${GATEWAY_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - gateway_pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis ----
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: llm-gw-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  litellm_pg_data:
  gateway_pg_data:
  redis_data:

networks:
  frontend:
  backend:
    internal: true
  llm_backends:
    external: true
