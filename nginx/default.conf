upstream litellm-backend {
    server litellm:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name $host;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/ssl/public.pem;
    ssl_certificate_key /etc/ssl/private.pem;

    # ---- Vouch Proxy validation endpoint ----
    location = /validate {
        proxy_pass http://vouch-proxy:9090/validate;
        proxy_set_header Host $http_host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;
        auth_request_set $auth_resp_x_vouch_idp_idtoken $upstream_http_x_vouch_idp_idtoken;
        auth_request_set $auth_resp_x_vouch_idp_accesstoken $upstream_http_x_vouch_idp_accesstoken;
        auth_request_set $auth_resp_jwt $upstream_http_x_vouch_jwt;
        auth_request_set $auth_resp_err $upstream_http_x_vouch_err;
        auth_request_set $auth_resp_failcount $upstream_http_x_vouch_failcount;
    }

    error_page 401 = @error401;

    location @error401 {
        return 302 $scheme://$http_host/login?url=$scheme://$http_host$request_uri&vouch-failcount=$auth_resp_failcount&X-Vouch-Token=$auth_resp_jwt&error=$auth_resp_err;
    }

    # ---- Vouch auth routes (no auth_request) ----
    location /auth {
        proxy_pass http://vouch-proxy:9090;
        proxy_set_header Host $http_host;
    }

    location /login {
        proxy_pass http://vouch-proxy:9090/login$is_args$args;
        proxy_set_header Host $http_host;
    }

    location /logout {
        proxy_pass http://vouch-proxy:9090/logout?url=$scheme://$http_host;
        proxy_set_header Host $http_host;
    }

    # ---- LLM proxy passthrough (virtual key auth, NO Vouch) ----
    location /v1/ {
        proxy_pass http://litellm-backend/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM streaming optimization
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1800;
    }

    # ---- Gateway API (Vouch-protected) ----
    location /api/v1/ {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;
        auth_request_set $auth_resp_x_vouch_idp_idtoken $upstream_http_x_vouch_idp_idtoken;
        auth_request_set $auth_resp_x_vouch_login $upstream_http_x_vouch_idp_claims_login;

        proxy_pass http://gateway-api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Vouch-User $auth_resp_x_vouch_user;
        proxy_set_header X-Vouch-IdP-Claims-Login $auth_resp_x_vouch_login;
        proxy_set_header X-Vouch-IdP-IdToken $auth_resp_x_vouch_idp_idtoken;

        add_header X-Debug-Vouch-User $auth_resp_x_vouch_user always;
        add_header X-Debug-Vouch-Login $auth_resp_x_vouch_login always;
    }

    # ---- LiteLLM Admin UI (Vouch-protected) ----
    location /litellm/ {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;

        proxy_pass http://litellm-backend/ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    # ---- LiteLLM UI internal routes (login, callbacks) ----
    location /ui/ {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;

        proxy_pass http://litellm-backend/ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- LiteLLM API endpoints (used by LiteLLM Admin UI) ----
    location ~ ^/(v2|health|key|model|user|team|global|spend|budget|end_user|organization|config|\.well-known)(/|$) {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;

        proxy_pass http://litellm-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- LiteLLM UI static assets ----
    location /litellm-asset-prefix/ {
        proxy_pass http://litellm-backend/litellm-asset-prefix/;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Next.js static assets (no auth needed) ----
    location /_next/ {
        proxy_pass http://gateway-app:3000/_next/;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Landing page (public, no auth) ----
    location = / {
        proxy_pass http://gateway-app:3000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Frontend (Vouch-protected) ----
    location / {
        auth_request /validate;
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;

        proxy_pass http://gateway-app:3000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Vouch-User $auth_resp_x_vouch_user;
    }
}
